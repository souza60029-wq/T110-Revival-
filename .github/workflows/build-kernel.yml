name: Build SM-T110 kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux 3.4.5 for SM-T110
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bc bison build-essential flex libncurses-dev libssl-dev

      - name: Install Android arm-eabi-4.6 toolchain
        env:
          TOOLCHAIN_COMMIT: b4ecd7806d8f46cddeacaf9f8de92c191fb266e4
        run: |
          git clone --quiet --depth 1 --branch jb-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.6 \
            "$RUNNER_TEMP/arm-eabi-4.6"
          test "$(git -C "$RUNNER_TEMP/arm-eabi-4.6" rev-parse HEAD)" = "$TOOLCHAIN_COMMIT"
          test -x "$RUNNER_TEMP/arm-eabi-4.6/bin/arm-eabi-gcc"
          echo "$RUNNER_TEMP/arm-eabi-4.6/bin" >> "$GITHUB_PATH"
          echo "CROSS_COMPILE=$RUNNER_TEMP/arm-eabi-4.6/bin/arm-eabi-" >> "$GITHUB_ENV"

      - name: Make legacy Perl helper compatible in runner workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          helper = Path("kernel/src/kernel/timeconst.pl")
          source = helper.read_text()
          old = "if (!defined(@val)) {"
          if source.count(old) != 1:
              raise SystemExit("Expected legacy Perl expression was not found exactly once")
          helper.write_text(source.replace(old, "if (!@val) {"))
          PY

      - name: Configure and compile
        run: |
          export KBUILD_BUILD_VERSION=2
          make -C kernel/src ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" pxa986_goyawifi_rev02_defconfig
          grep -qx 'CONFIG_LOCALVERSION="-2679758"' kernel/src/.config
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' kernel/src/.config
          make -C kernel/src ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" -j2 zImage modules
          test -s kernel/src/arch/arm/boot/zImage
          release=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' kernel/src/include/generated/utsrelease.h)
          uts_version=$(sed -n 's/^#define UTS_VERSION "\(.*\)"/\1/p' kernel/src/include/generated/compile.h)
          echo "UTS_RELEASE=$release"
          echo "UTS_VERSION=$uts_version"
          test "$release" = "3.4.5-2679758"
          case "$uts_version" in "#2 SMP PREEMPT "*) ;; *) echo "Unexpected UTS_VERSION: $uts_version"; exit 1 ;; esac
          module=$(find kernel/src -type f -name '*.ko' | sort | head -n 1)
          test -n "$module"
          vermagic=$(strings "$module" | sed -n 's/^vermagic=//p' | head -n 1)
          echo "MODULE_VERMAGIC=$vermagic"
          case "$vermagic" in "3.4.5-2679758 SMP preempt "*) ;; *) echo "Unexpected vermagic: $vermagic"; exit 1 ;; esac

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: SM-T110-zImage
          path: kernel/src/arch/arm/boot/zImage
          if-no-files-found: error
